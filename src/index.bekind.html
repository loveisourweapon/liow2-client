<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <base href="/" />

    <title>BeKind School</title>
    <link rel="icon" type="image/png" href="favicon-bekind.png" />

    <!--
      Share card defaults. MetaService overrides these per page as you navigate, but
      crawlers don't run JavaScript, so these are what Facebook, LinkedIn, Slack and X
      see for every URL. Rendering per-deed and per-group tags server-side is BK-16.

      og:url is deliberately absent - in a static file it could only name the homepage,
      and Facebook treats it as canonical, so every shared deed link would resolve back
      to the homepage. Without it, crawlers use the URL that was actually shared.
    -->
    <meta
      name="description"
      content="Inspiring students, teachers and school communities to create positive change through simple, intentional acts of kindness. Start or join a campaign today."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BeKind School" />
    <meta property="og:title" content="BeKind School" />
    <meta
      property="og:description"
      content="Inspiring students, teachers and school communities to create positive change through simple, intentional acts of kindness. Start or join a campaign today."
    />
    <!-- TODO: replace with the real 1200x630 artwork -->
    <meta
      property="og:image"
      content="https://res.cloudinary.com/liow/image/upload/og-bekind.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BeKind School" />
    <meta
      name="twitter:description"
      content="Inspiring students, teachers and school communities to create positive change through simple, intentional acts of kindness. Start or join a campaign today."
    />
    <meta
      name="twitter:image"
      content="https://res.cloudinary.com/liow/image/upload/og-bekind.jpg"
    />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9ETCB2020Z"></script>
    <!-- prettier-ignore -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9ETCB2020Z');
    </script>
  </head>
  <body>
    <liow-root>
      <div class="app-loading-spinner">
        <img src="/images/logo-bks.svg" class="m-r-md middle" />
        <i class="fa fa-5x fa-gear fa-spin middle"></i>
      </div>
    </liow-root>
  </body>
</html>
