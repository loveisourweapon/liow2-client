<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <base href="/" />

    <title>BeKind School</title>
    <link rel="icon" type="image/png" href="favicon-bekind.png" />

    <!--
      Share card defaults, and all a crawler sees for any URL until BK-16 renders these
      per page. MetaService keeps them current in the live DOM as you navigate.

      No og:url on purpose: here it could only name the homepage, and Facebook treats it
      as canonical, so every shared deed link would resolve back to /. Left out, crawlers
      use the URL that was actually shared.
    -->
    <meta
      name="description"
      content="BeKind is Australia’s first measurable school culture program, a new approach to school wellbeing. Curriculum-aligned learning, practical acts of kindness and real-time impact measurement empower students to change their school and community for the better."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BeKind School" />
    <meta property="og:title" content="BeKind School" />
    <meta
      property="og:description"
      content="BeKind is Australia’s first measurable school culture program, a new approach to school wellbeing. Curriculum-aligned learning, practical acts of kindness and real-time impact measurement empower students to change their school and community for the better."
    />
    <!-- TODO: replace with the real 1200x630 artwork -->
    <meta
      property="og:image"
      content="https://res.cloudinary.com/liow/image/upload/og-bekind.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BeKind School" />
    <meta
      name="twitter:description"
      content="BeKind is Australia’s first measurable school culture program, a new approach to school wellbeing. Curriculum-aligned learning, practical acts of kindness and real-time impact measurement empower students to change their school and community for the better."
    />
    <meta
      name="twitter:image"
      content="https://res.cloudinary.com/liow/image/upload/og-bekind.jpg"
    />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9ETCB2020Z"></script>
    <!-- prettier-ignore -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9ETCB2020Z');
    </script>
  </head>
  <body>
    <liow-root>
      <div class="app-loading-spinner">
        <img src="/images/logo-bks.svg" class="m-r-md middle" />
        <i class="fa fa-5x fa-gear fa-spin middle"></i>
      </div>
    </liow-root>
  </body>
</html>
